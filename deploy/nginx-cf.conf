# /etc/nginx/sites-available/cf-mp
# 启用:  ln -s /etc/nginx/sites-available/cf-mp /etc/nginx/sites-enabled/cf-mp
#        rm -f /etc/nginx/sites-enabled/default
#        nginx -t && systemctl reload nginx

# WebSocket 升级头透传（联机功能的关键）
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# 上游中继服务
upstream cf_mp {
    server 127.0.0.1:8080;
    keepalive 32;
}

server {
    listen 80;
    server_name _;   # 换成你自己的域名，或保持 _ 用 IP 访问

    # 单文件体积较大，放宽 body 限制（本服务不接收上传，保险起见）
    client_max_body_size 8m;

    # ---- 可选：简易口令门禁 ----
    # 生成密码:  printf '你的用户名:$(openssl passwd -apr1 你的密码)\n' | sudo tee /etc/nginx/.cfmp_htpasswd
    # 然后把下面两行的注释去掉，可挡掉绝大多数扫描器和陌生人。
    # auth_basic "CF MP - restricted";
    # auth_basic_user_file /etc/nginx/.cfmp_htpasswd;

    location / {
        proxy_pass http://cf_mp;

        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 联机是长连接，超时必须放宽，否则几分钟就断线
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
        proxy_buffering     off;

        # 887KB 的 HTML，别让它边传边卡
        gzip on;
        gzip_types text/html application/javascript text/css;
        gzip_min_length 1024;
    }

    # 健康检查（Nginx 层直接返回，不打扰 Node）
    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }
}
